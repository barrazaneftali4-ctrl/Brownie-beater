<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brownie Beater</title>
    <style>
        /* CSS ONLY IN HERE */
        body {
            text-align: center;
            font-family: Arial;
            background-image: url("background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0; 
            padding: 0; 
        }

        h1 { margin-top: 30px; }

        .tubeLabel {
            position: fixed; 
            bottom: 10%; 
            font-weight: bold; 
            font-size: 14px; 
            width: 60px; 
            text-align: center; 
        }

        #roomInfo { 
            position: absolute; 
            top: 20px; 
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7); 
            color: #ffeb3b; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-size: 18px; 
            z-index: 100; 
        }

        #brownie {
            width: 300px;
            cursor: pointer;
            display: block; 
            margin: 100px auto 0 auto; 
            transition: transform 0.1s;
        }
        
        #brownie:active { transform: scale(0.9); }

        .tubeContainer {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 300px;
            border: 3px solid #333;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }

        #myTube { left: 30px; }
        #opponentTube { right: 30px; }

        .fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            transition: height 0.2s ease;
        }

        #myFill { background: linear-gradient(to top, #fa1515, #f10808); }
        #oppFill { background: linear-gradient(to top, #3b82f6, #2563eb); }

        #hudBox {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

<div id="roomInfo">Room: ---</div> 

<div id="myTube" class="tubeContainer"> 
    <div id="myFill" class="fill"></div> 
</div>
<div class="tubeLabel" style="left: 25px;">YOU</div>

<div id="opponentTube" class="tubeContainer"> 
    <div id="oppFill" class="fill"></div> 
</div> 
<div class="tubeLabel" style="right: 25px;">THEM</div> 

<h1>Brownie Beater</h1>

<img id="brownie"
     src="https://upload.wikimedia.org/wikipedia/commons/e/e9/Brownie_transparent.png"
     alt="Brownie">

<div id="hudBox">
    <div id="counter">Clicks: 0</div>
    <div id="cps">CPS: 0</div>
</div>

<script>
    // --- VARIABLES ---
    var clicks = 0;
    var clicksThisSecond = 0;
    var cps = 0;
    var maxClicks = 500;
    
    var params = new URLSearchParams(window.location.search); 
    var roomCode = params.get("room"); 
    var myName = localStorage.getItem('username') || "Player"; 

    var brownie = document.getElementById("brownie");
    var counter = document.getElementById("counter");
    var myFill = document.getElementById("myFill");
    var oppFill = document.getElementById("oppFill"); 
    var roomDisplay = document.getElementById("roomInfo"); 
    var cpsDisplay = document.getElementById("cps");

    if (roomCode) {
        roomDisplay.textContent = "Room Code: " + roomCode;
    }

    // --- GAME LOGIC ---
    brownie.addEventListener("click", function() {
        clicks++;
        clicksThisSecond++;
        counter.textContent = "Clicks: " + clicks;

        var percent = (clicks / maxClicks) * 100;
        if (percent > 100) percent = 100;
        myFill.style.height = percent + "%";

        sendScore(); 

        if(clicks >= maxClicks) {
            alert("VICTORY! You beat the brownie!"); 
        }
    });

    function sendScore() {
        if (!roomCode) return; 

        fetch('http://localhost:3000/updateClicks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                roomCode: roomCode,
                username: myName,
                clicks: clicks
            })
        });
    }

    // --- MULTIPLAYER SYNC (Heartbeat) ---
    setInterval(function() {
        if (!roomCode) return;

        fetch('http://localhost:3000/roomStatus/' + roomCode)
        .then(function(res) { return res.json(); })
        .then(function(data) {
            for (var user in data.scores) {
                // If it's not me, it's "Them"
                if (user.toLowerCase() !== myName.toLowerCase()) {
                    var oppClicks = data.scores[user];
                    var oppPercent = (oppClicks / maxClicks) * 100;
                    
                    if (oppPercent > 100) oppPercent = 100;
                    if (oppFill) {
                        oppFill.style.height = oppPercent + "%";
                    }
                }
            }
        })
        .catch(function(err) {
            console.log("Error fetching status: " + err);
        });
    }, 500); // 500ms for a snappy feel
    
    // CPS Counter
    setInterval(function() {
        cps = clicksThisSecond;
        clicksThisSecond = 0;
        cpsDisplay.textContent = "CPS: " + cps;
    }, 1000);

</script>
</body>
</html>
