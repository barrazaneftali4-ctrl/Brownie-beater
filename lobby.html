<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brownie Beater - Lobby</title>
  <link rel ="stylesheet" href="style.css">
  <link rel="shortcut icon" type="x-icon" href="browniebeatericon.png">	
</head>
<body id = "lobby-page">
	<div id="loading-overlay" style="display: none;"> 
           <div class="spinner"></div> 
           <p id="loading-text">Preparing your kitchen...</p>
   </div>          
	
   <div class="container">
	<div class="form-box active"> 
           <h1>Brownie Beater-Lobby</h1>
	   <p style="margin-bottom: 20px;"> Pick host game to start a game, or join a exisiting game!</p>

           <button onclick="hostGame()">Host Game</button>
  
            <button onclick="joinGame()" style="background: #5d382d; color: white;">Join Game</button>
  
  <p style="margin-top: 15px;">
    <a href="#" onclick="logout()" style="font-size: 12px; color: #ff6b6b;">Logout</a> 
  </p>
	</div>
   </div>

  <script>
	  const API_URL = "https://brownie-beater.onrender.com";

	    function toggleLoading(show, text = "Loading...") {
            const overlay = document.getElementById('loading-overlay'); 
            const loadingText = document.getElementById('loading-text'); 
            if(overlay) {
                    overlay.style.display = show ? 'flex' : 'none'; 
                    if (text && loadingText) loadingText.innerText = text; 
            }
    }
	  
    var token = localStorage.getItem('token');
    var myName = localStorage.getItem('username'); 

    //redirected if not loggin
    if(token == null) {
        alert("You are not logged in!"); 
        window.location.href = "index.html"; 
    }

    function hostGame() {
        toggleLoading(true, "Creating room..."); 

	    fetch(`${API_URL}/createRoom`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: myName })
        })
        .then(function(res) {
            return res.json();
        })
        .then(function(data) {
            toggleLoading(false); 
            window.location.href = "waitroom.html?mode=host&room=" + data.roomCode; 
        })
        .catch(function(err) {
            console.log("Host error: " + err); 
            alert("Server is down, couldn't host."); 
        }); 
    }

 
    function joinGame() {
        var codeFromUser = prompt("Enter the 4-digit Room Code:"); 
        if (!codeFromUser) return; 
        console.log("Joining room: " + codeFromUser); 
        window.location.href = "waitroom.html?mode=join&room=" + codeFromUser;
    }

    function logout() {
        console.log("Cleaning up local storage and logging out..."); 
        localStorage.clear();
        window.location.href = "index.html"; 
    }
    
  </script>

</body>
</html>
